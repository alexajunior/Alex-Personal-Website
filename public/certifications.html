<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <title>Alex A. Junior - Certifications</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { background: #0d1117; color: #f0f6fc; font: 14px "DM Mono", Consolas, monospace; }
      header { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 24px; border-bottom: 1px solid #30363d; }
      a { color: #7ee787; text-decoration: none; }
      a:hover { color: #aff5b5; }
      main { min-height: calc(100% - 64px); max-width: 1000px; margin: 0 auto; padding: 24px 14px 48px; }
      #status { color: #8b949e; margin: 0 0 18px; }
      #gallery { display: grid; gap: 24px; }
      figure { margin: 0; padding: 12px; background: #fff; border: 1px solid #30363d; }
      canvas { width: 100%; height: auto; display: block; }
      figcaption { color: #57606a; background: #fff; padding: 8px 2px 0; font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <span>&gt;_ Alex A. Junior / Certifications</span>
      <a href="/">Back to portfolio</a>
    </header>
    <main>
      <p id="status">Rendering certifications for viewing…</p>
      <section id="gallery" aria-label="Certification pages"></section>
    </main>
    <script type="module">
      import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs";
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.worker.min.mjs";
      const status = document.getElementById("status");
      const gallery = document.getElementById("gallery");
      pdfjsLib.getDocument("/Alex-A-Junior-portfolio.pdf").promise.then(async (pdf) => {
        status.textContent = `${pdf.numPages} certification pages`;
        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const viewport = page.getViewport({ scale: 1.35 });
          const figure = document.createElement("figure");
          const canvas = document.createElement("canvas");
          const caption = document.createElement("figcaption");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          caption.textContent = `Page ${pageNumber}`;
          figure.append(canvas, caption);
          gallery.append(figure);
          await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
        }
      }).catch(() => {
        status.textContent = "Certification pages could not be rendered. Please refresh and try again.";
      });
    </script>
  </body>
</html>
